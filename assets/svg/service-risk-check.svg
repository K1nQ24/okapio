<svg xmlns="http://www.w3.org/2000/svg" id="ill-risk-check" viewBox="0 0 480 320" role="img" aria-labelledby="ill-risk-check-title ill-risk-check-desc" fill="none" stroke="var(--ill-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ill-risk-check-title">Risiko-Matrix mit priorisierter Liste</title>
  <desc id="ill-risk-check-desc">Eine Matrix aus Wahrscheinlichkeit und Schaden. Mehrere Risiken liegen als Punkte darin, zwei davon im kritischen Feld oben rechts. Eine Linie führt vom kritischsten Risiko zu einer Liste, die die Reihenfolge der Maßnahmen zeigt.</desc>

  <!-- Matrix: Tarnung links (dichte Streifen), Klarheit rechts -->
  <g id="rc-stripes" data-stagger="grow" fill="var(--ill-ink)" stroke="none" opacity="0.1">
    <rect x="20" y="232" width="2" height="68"/><rect x="30" y="220" width="5" height="80"/><rect x="42" y="250" width="1" height="50"/><rect x="50" y="240" width="3" height="60"/><rect x="60" y="262" width="2" height="38"/>
  </g>

  <rect id="rc-grid" data-fade x="16" y="20" width="248" height="280" rx="16" fill="var(--ill-surface)"/>

  <g id="rc-cells" data-fade stroke="none" fill="var(--ill-risk)">
    <rect x="184" y="48" width="64" height="64" rx="6" opacity="0.2"/>
    <rect x="120" y="48" width="64" height="64" rx="6" opacity="0.09"/>
    <rect x="184" y="112" width="64" height="64" rx="6" opacity="0.09"/>
  </g>
  <g id="rc-lines" data-fade stroke="var(--ill-line-soft)" stroke-width="1.5">
    <path d="M56 48h192M56 112h192M56 176h192M56 240h192"/>
    <path d="M56 48v192M120 48v192M184 48v192M248 48v192"/>
  </g>

  <!-- Risiken als Punkte -->
  <g id="rc-dots" data-stagger="fade" fill="var(--ill-muted)" stroke="none">
    <circle cx="88" cy="208" r="6"/><circle cx="152" cy="208" r="6"/><circle cx="88" cy="144" r="6"/><circle cx="152" cy="144" r="6"/><circle cx="216" cy="144" r="6"/><circle cx="152" cy="80" r="6"/>
  </g>
  <g id="rc-risk-1" data-pop fill="var(--ill-risk)" stroke="none"><circle cx="228" cy="68" r="9"/></g>
  <g id="rc-risk-2" data-pop fill="var(--ill-risk)" stroke="none"><circle cx="204" cy="92" r="7"/></g>

  <!-- Verbindung zur Liste -->
  <path id="rc-link" pathLength="1" data-draw stroke="var(--ill-risk)" stroke-dasharray="1" d="M237 68C262 68 274 86 300 86"/>

  <!-- Priorisierte Liste -->
  <g id="rc-list" data-stagger="slide">
    <g id="rc-row-1"><rect x="300" y="64" width="164" height="44" rx="8" fill="var(--ill-surface-2)" stroke="var(--ill-risk)" stroke-width="2.5"/><circle cx="324" cy="86" r="11" fill="var(--ill-risk)" stroke="none"/><text x="324" y="91" fill="var(--ill-surface)" stroke="none" font-family="var(--font-display)" font-size="14" font-weight="700" text-anchor="middle">1</text><path stroke="var(--ill-ink)" stroke-width="3" d="M346 80h86"/><path stroke="var(--ill-muted)" stroke-width="3" opacity="0.7" d="M346 92h50"/></g>
    <g id="rc-row-2"><rect x="300" y="124" width="164" height="44" rx="8" fill="var(--ill-surface-2)" stroke="none"/><circle cx="324" cy="146" r="11" stroke="var(--ill-line)" stroke-width="2"/><text x="324" y="151" fill="var(--ill-ink)" stroke="none" font-family="var(--font-display)" font-size="14" font-weight="700" text-anchor="middle">2</text><path stroke="var(--ill-ink)" stroke-width="3" d="M346 140h70"/><path stroke="var(--ill-muted)" stroke-width="3" opacity="0.7" d="M346 152h44"/></g>
    <g id="rc-row-3"><rect x="300" y="184" width="164" height="44" rx="8" fill="var(--ill-surface-2)" stroke="none"/><circle cx="324" cy="206" r="11" stroke="var(--ill-line)" stroke-width="2"/><text x="324" y="211" fill="var(--ill-ink)" stroke="none" font-family="var(--font-display)" font-size="14" font-weight="700" text-anchor="middle">3</text><path stroke="var(--ill-ink)" stroke-width="3" d="M346 200h94"/><path stroke="var(--ill-muted)" stroke-width="3" opacity="0.7" d="M346 212h58"/></g>
  </g>

  <g id="rc-labels" data-fade fill="var(--ill-muted)" stroke="none" font-family="var(--font-text)" font-size="13" font-weight="600" text-anchor="middle">
    <text x="152" y="266">Wahrscheinlichkeit</text>
    <text x="0" y="0" transform="translate(36 144) rotate(-90)">Schaden</text>
    <text x="382" y="48">Reihenfolge</text>
    <text x="382" y="256">Zuerst das Kritische</text>
  </g>

  <!-- Dauerbewegung (SMIL): Datenpakete entlang der Linien, Impulse an Risiko-/Schutzpunkten. Sichtbar nur mit JS, ohne reduzierte Bewegung, nach dem Aufbau (motion.css). -->
  <g id="rc-flow" class="flow">
    <circle cx="228" cy="68" r="10" fill="none" stroke="var(--ill-risk)" stroke-width="2" opacity="0"><animate attributeName="r" values="10;26" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="204" cy="92" r="8" fill="none" stroke="var(--ill-risk)" stroke-width="2" opacity="0"><animate attributeName="r" values="8;22" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="var(--ill-risk)" stroke="none" opacity="0"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#rc-link"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
  </g>
</svg>
