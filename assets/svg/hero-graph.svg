<svg xmlns="http://www.w3.org/2000/svg" id="ill-hero-graph" viewBox="0 0 640 560" role="img" aria-labelledby="ill-hero-graph-title ill-hero-graph-desc" fill="none" stroke="var(--ill-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ill-hero-graph-title">Angriffspfad wird an der Schutzschicht gestoppt</title>
  <desc id="ill-hero-graph-desc">Netzwerkgraph aus Servern, Cloud und Endgeräten. Ein Angriffspfad (blau hervorgehoben) führt von außen über Web und API auf die Kundendaten und wird von einem Schutzschild gestoppt.</desc>

  <!-- Tarnschicht: Streifen, die sich hinter dem Ziel verdichten -->
  <g id="hg-stripes" data-stagger="grow" fill="var(--ill-ink)" stroke="none" opacity="0.12">
    <rect x="392" y="330" width="2" height="190"/>
    <rect x="404" y="300" width="5" height="220"/>
    <rect x="418" y="360" width="1" height="160"/>
    <rect x="428" y="270" width="8" height="250"/>
    <rect x="446" y="340" width="2" height="180"/>
    <rect x="458" y="290" width="3" height="230"/>
    <rect x="474" y="320" width="2" height="200"/>
    <rect x="484" y="250" width="5" height="270"/>
    <rect x="500" y="380" width="1" height="140"/>
    <rect x="510" y="300" width="8" height="220"/>
    <rect x="530" y="360" width="2" height="160"/>
    <rect x="542" y="330" width="3" height="190"/>
    <rect x="560" y="400" width="2" height="120"/>
    <rect x="574" y="370" width="5" height="150"/>
    <rect x="594" y="430" width="1" height="90"/>
    <rect x="608" y="410" width="3" height="110"/>
  </g>

  <!-- Ruhige Kanten (Netzwerk) -->
  <g id="hg-edges" data-stagger="draw" stroke-width="2">
    <path id="hg-e-web-laptop" pathLength="1" data-draw d="M185 205 L110 370"/>
    <path id="hg-e-web-cloud" pathLength="1" data-draw d="M185 205 L330 360"/>
    <path id="hg-e-web-api" pathLength="1" data-draw d="M185 205 L320 145"/>
    <path id="hg-e-api-cloud" pathLength="1" data-draw d="M320 145 L330 360"/>
    <path id="hg-e-api-endpoint" pathLength="1" data-draw d="M320 145 L540 150"/>
    <path id="hg-e-api-data" pathLength="1" data-draw d="M320 145 L525 340"/>
    <path id="hg-e-cloud-data" pathLength="1" data-draw d="M330 360 L525 340"/>
    <path id="hg-e-cloud-server" pathLength="1" data-draw d="M330 360 L235 480"/>
    <path id="hg-e-laptop-server" pathLength="1" data-draw d="M110 370 L235 480"/>
    <path id="hg-e-endpoint-data" pathLength="1" data-draw d="M540 150 L525 340"/>
    <path id="hg-e-internet-web" pathLength="1" data-draw d="M60 110 L185 205"/>
  </g>

  <!-- Angriffspfad: leuchtet von außen auf und endet am Schild -->
  <g id="hg-attack-path" stroke="var(--ill-risk)">
    <path id="hg-attack-seg" pathLength="1" data-draw stroke-width="3.5" d="M60 110 L185 205 L320 145 L408 231"/>
    <circle id="hg-attack-head" data-fade cx="408" cy="231" r="5" fill="var(--ill-risk)" stroke="none"/>
  </g>

  <!-- Puls-Ringe der Knoten (dezent, nur transform/opacity) -->
  <g id="hg-node-rings" data-stagger="pulse" stroke="var(--ill-line)" stroke-width="1.5" opacity="0.5">
    <circle id="hg-ring-web" cx="185" cy="205" r="28"/>
    <circle id="hg-ring-api" cx="320" cy="145" r="28"/>
    <circle id="hg-ring-cloud" cx="330" cy="360" r="28"/>
    <circle id="hg-ring-laptop" cx="110" cy="370" r="28"/>
    <circle id="hg-ring-server" cx="235" cy="480" r="28"/>
    <circle id="hg-ring-endpoint" cx="540" cy="150" r="28"/>
    <circle id="hg-ring-data" cx="525" cy="340" r="34"/>
  </g>

  <!-- Knoten -->
  <g id="hg-nodes" data-stagger="fade" fill="var(--ill-surface)">
    <g id="hg-n-internet" transform="translate(60 110)">
      <circle r="22"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><circle r="9"/><ellipse rx="4" ry="9"/><path d="M-9 0H9"/></g>
    </g>
    <g id="hg-n-web" transform="translate(185 205)">
      <circle r="20"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><rect x="-9" y="-10" width="18" height="7" rx="2"/><rect x="-9" y="2" width="18" height="7" rx="2"/><path d="M-5 -6.5h.01M-5 5.5h.01"/></g>
    </g>
    <g id="hg-n-api" transform="translate(320 145)">
      <circle r="20"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><path d="M-4 -7l-6 7 6 7M4 -7l6 7-6 7"/></g>
    </g>
    <g id="hg-n-cloud" transform="translate(330 360)">
      <circle r="20"/>
      <path stroke="var(--ill-ink)" stroke-width="1.75" d="M-8 5a4.5 4.5 0 0 1-.4-9 6.5 6.5 0 0 1 12.4-1.5 5 5 0 0 1 3 10.5z"/>
    </g>
    <g id="hg-n-laptop" transform="translate(110 370)">
      <circle r="20"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><rect x="-8" y="-8" width="16" height="11" rx="1.5"/><path d="M-11 7h22"/></g>
    </g>
    <g id="hg-n-server" transform="translate(235 480)">
      <circle r="20"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><rect x="-9" y="-10" width="18" height="7" rx="2"/><rect x="-9" y="2" width="18" height="7" rx="2"/><path d="M-5 -6.5h.01M-5 5.5h.01"/></g>
    </g>
    <g id="hg-n-endpoint" transform="translate(540 150)">
      <circle r="20"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><circle cy="-4" r="4"/><path d="M-8 9a8 7 0 0 1 16 0"/></g>
    </g>
    <g id="hg-n-data" transform="translate(525 340)">
      <circle r="26"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><ellipse cy="-7" rx="10" ry="4"/><path d="M-10 -7v14a10 4 0 0 0 20 0v-14M-10 0a10 4 0 0 0 20 0"/></g>
    </g>
  </g>

  <!-- Beschriftung (dekorativ; Inhalt steht in der Bildbeschreibung) -->
  <g id="hg-labels" data-fade fill="var(--ill-muted)" stroke="none" font-family="var(--font-text)" font-size="13" font-weight="600" text-anchor="middle">
    <text x="60" y="150">Internet</text>
    <text x="185" y="243">Web</text>
    <text x="320" y="113">API</text>
    <text x="525" y="384">Kundendaten</text>
  </g>

  <!-- Schild: blockiert den Pfad (Teal = geschützt) -->
  <g id="hg-shield">
    <circle id="hg-shield-ring" cx="425" cy="245" r="30" stroke="var(--ill-safe)" stroke-width="2" opacity="0"/>
    <g id="hg-shield-body" data-pop>
      <path fill="var(--ill-surface)" stroke="var(--ill-safe)" stroke-width="3" d="M425 220l20 7v15c0 15-9 26-20 32-11-6-20-17-20-32v-15z"/>
      <path id="hg-shield-check" pathLength="1" data-draw stroke="var(--ill-safe)" stroke-width="3" d="M415 246l7 7 13-14"/>
    </g>
  </g>

  <!-- Hinweis-Etikett -->
  <g id="hg-blocked-tag" data-rise>
    <rect x="448" y="196" width="88" height="26" rx="13" fill="var(--ill-surface)" stroke="var(--ill-safe)" stroke-width="1.75"/>
    <text x="492" y="213.5" fill="var(--ill-safe)" stroke="none" font-family="var(--font-text)" font-size="12.5" font-weight="700" text-anchor="middle">blockiert</text>
  </g>
</svg>
