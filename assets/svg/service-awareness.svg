<svg xmlns="http://www.w3.org/2000/svg" id="ill-awareness" viewBox="0 0 640 300" role="img" aria-labelledby="ill-awareness-title ill-awareness-desc" fill="none" stroke="var(--ill-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title id="ill-awareness-title">Ein Phishing-Signal wird von Menschen im Netzwerk erkannt</title>
  <desc id="ill-awareness-desc">Personen als Knoten in einem Netzwerk. Eine Phishing-Nachricht erreicht mehrere Personen. Eine davon erkennt sie und meldet sie an die Meldestelle.</desc>

  <!-- Netzwerk zwischen den Personen -->
  <g id="aw-network-edges" data-stagger="draw">
    <path id="aw-pe-1-3" pathLength="1" data-draw d="M190 76L320 150"/>
    <path id="aw-pe-2-3" pathLength="1" data-draw d="M200 232L320 150"/>
    <path id="aw-pe-1-2" pathLength="1" data-draw d="M190 76L200 232"/>
    <path id="aw-pe-3-4" pathLength="1" data-draw d="M320 150L430 70"/>
    <path id="aw-pe-3-5" pathLength="1" data-draw d="M320 150L440 236"/>
    <path id="aw-pe-4-r" pathLength="1" data-draw d="M430 70L570 150"/>
    <path id="aw-pe-5-r" pathLength="1" data-draw d="M440 236L570 150"/>
  </g>

  <!-- Phishing: Nachricht läuft zu mehreren Personen -->
  <g id="aw-phish" stroke="var(--ill-risk)">
    <path id="aw-phish-path-1" data-fade stroke-dasharray="4 7" d="M86 132L166 84"/>
    <path id="aw-phish-path-2" data-fade stroke-dasharray="4 7" d="M86 168L176 224"/>
    <path id="aw-phish-path-main" pathLength="1" data-draw stroke-width="3" d="M90 150H294"/>
    <g id="aw-phish-mail" data-fade transform="translate(52 150)" fill="var(--ill-surface)">
      <rect x="-26" y="-18" width="52" height="36" rx="8"/><path d="M-26-10l26 16 26-16"/>
    </g>
  </g>

  <g id="aw-people" data-stagger="fade" fill="var(--ill-surface)">
    <g id="aw-p-1" transform="translate(190 76)"><circle r="24"/><g stroke="var(--ill-ink)" stroke-width="1.75"><circle cy="-5" r="5"/><path d="M-10 11a10 8 0 0 1 20 0"/></g></g>
    <g id="aw-p-2" transform="translate(200 232)"><circle r="24"/><g stroke="var(--ill-ink)" stroke-width="1.75"><circle cy="-5" r="5"/><path d="M-10 11a10 8 0 0 1 20 0"/></g></g>
    <g id="aw-p-3" transform="translate(320 150)">
      <circle id="aw-signal-ring-1" r="30" stroke="var(--ill-safe)" stroke-width="2" opacity="0"/>
      <circle id="aw-signal-ring-2" r="30" stroke="var(--ill-safe)" stroke-width="2" opacity="0"/>
      <circle id="aw-p-3-body" r="26" stroke="var(--ill-safe)" stroke-width="3"/>
      <g stroke="var(--ill-ink)" stroke-width="1.75"><circle cy="-5" r="5.5"/><path d="M-11 12a11 9 0 0 1 22 0"/></g>
    </g>
    <g id="aw-p-4" transform="translate(430 70)"><circle r="24"/><g stroke="var(--ill-ink)" stroke-width="1.75"><circle cy="-5" r="5"/><path d="M-10 11a10 8 0 0 1 20 0"/></g></g>
    <g id="aw-p-5" transform="translate(440 236)"><circle r="24"/><g stroke="var(--ill-ink)" stroke-width="1.75"><circle cy="-5" r="5"/><path d="M-10 11a10 8 0 0 1 20 0"/></g></g>
  </g>

  <!-- Erkannt: Häkchen + Meldung an die Meldestelle -->
  <g id="aw-recognized">
    <g id="aw-recognized-badge" data-fade transform="translate(340 128)"><circle r="11" fill="var(--ill-safe)" stroke="none"/><path id="aw-recognized-check" pathLength="1" data-draw stroke="var(--ill-surface)" stroke-width="2.5" d="M-4.5 .5l3.2 3.2 6-6.7"/></g>
    <path id="aw-report-path" pathLength="1" data-draw stroke="var(--ill-safe)" stroke-width="3" d="M350 156L440 150Q500 148 546 150"/>
    <g id="aw-report-node" data-fade transform="translate(575 150)" fill="var(--ill-surface)">
      <circle r="28" stroke="var(--ill-safe)" stroke-width="3"/>
      <path stroke="var(--ill-safe)" stroke-width="2.5" d="M0-14l11 4v8c0 8-5 13-11 16-6-3-11-8-11-16v-8z"/>
    </g>
  </g>

  <g id="aw-labels" data-fade fill="var(--ill-muted)" stroke="none" font-family="var(--font-text)" font-size="13" font-weight="600" text-anchor="middle">
    <text x="52" y="192">Phishing-Mail</text>
    <text x="320" y="204">erkennt &amp; meldet</text>
    <text x="575" y="200">Meldestelle</text>
  </g>
</svg>
